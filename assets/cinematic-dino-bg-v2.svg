<path d="M770 900 C820 810 900 740 940 660 C970 605 970 605 985 570 C1010 625 1080 710 1190 900Z" fill="url(#path)" opacity=".92"/>
<path d="M855 900 C900 805 950 720 970 650" fill="none" stroke="#708276" stroke-opacity=".2" stroke-width="5"/>
