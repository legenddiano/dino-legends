<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#030712"/><stop offset=".42" stop-color="#102b3a"/><stop offset=".72" stop-color="#24433d"/><stop offset="1" stop-color="#07110f"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff7d0"/><stop offset=".18" stop-color="#ffd18a" stop-opacity=".95"/><stop offset=".48" stop-color="#ff774e" stop-opacity=".32"/><stop offset="1" stop-color="#ff5533" stop-opacity="0"/></radialGradient>
 <linearGradient id="far" x2="0" y2="1"><stop stop-color="#35556a"/><stop offset="1" stop-color="#12232d"/></linearGradient>
 <linearGradient id="mid" x2="0" y2="1"><stop stop-color="#1c3d3b"/><stop offset="1" stop-color="#081714"/></linearGradient>
 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#19342d"/><stop offset=".5" stop-color="#0b1c18"/><stop offset="1" stop-color="#020706"/></linearGradient>
 <linearGradient id="path" x2="0" y2="1"><stop stop-color="#41534a"/><stop offset="1" stop-color="#111a16"/></linearGradient>
 <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter><filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
 <linearGradient id="mist"><stop stop-color="#bce9df" stop-opacity=".18"/><stop offset="1" stop-color="#bce9df" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1920" height="900" fill="url(#sky)"/>
<circle cx="1450" cy="185" r="300" fill="url(#sun)"/>
<g fill="#d8f4ee" opacity=".6"><circle cx="90" cy="110" r="1.6"/><circle cx="170" cy="190" r="2"/><circle cx="310" cy="95" r="1.4"/><circle cx="460" cy="165" r="1.8"/><circle cx="610" cy="80" r="1.3"/><circle cx="790" cy="145" r="2"/><circle cx="930" cy="70" r="1.4"/><circle cx="1100" cy="180" r="1.5"/><circle cx="1260" cy="85" r="1.8"/><circle cx="1690" cy="90" r="1.5"/><circle cx="1810" cy="220" r="2"/></g>
<!-- distant volcanic ridge -->
<path d="M0 520 L120 410 250 470 410 285 560 455 730 330 850 470 1040 265 1180 450 1330 350 1490 475 1640 285 1780 430 1920 330 V650 H0Z" fill="url(#far)"/>
<path d="M360 335 l50-50 42 68 36-45 26 58 M990 315 l48-50 35 60 38-52 32 64 M1590 330 l50-45 34 56 35-38 30 50" fill="none" stroke="#b6d4d7" stroke-opacity=".28" stroke-width="6"/>
