<ellipse cx="960" cy="560" rx="820" ry="95" fill="url(#mist)" filter="url(#blur30)"/>
<!-- mid jungle silhouette -->
<path d="M0 590 Q90 510 175 565 T350 555 T520 570 T690 545 T860 565 T1030 550 T1200 575 T1370 550 T1540 570 T1710 540 T1920 565 V900 H0Z" fill="url(#mid)"/>
