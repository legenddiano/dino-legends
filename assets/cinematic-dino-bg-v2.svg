<g fill="#12372d" opacity=".9"><circle cx="100" cy="450" r="70"/><circle cx="240" cy="470" r="65"/><circle cx="390" cy="405" r="80"/><circle cx="560" cy="450" r="70"/><circle cx="770" cy="400" r="95"/><circle cx="1170" cy="440" r="85"/><circle cx="1340" cy="430" r="72"/><circle cx="1550" cy="400" r="90"/><circle cx="1750" cy="455" r="75"/></g>
<!-- ground -->
<path d="M0 625 Q240 575 480 635 T960 620 T1440 635 T1920 610 V900 H0Z" fill="url(#ground)"/>
